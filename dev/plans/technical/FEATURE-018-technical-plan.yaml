    merge_strategy: "One PR per task into main, merged before the next dependent task starts, so main always matches what is applied. Ordering gates: 18.6 and 18.7 only after 18.2 is applied in BOTH envs (review H2); 18.7 only after 18.5 is applied in both envs."
