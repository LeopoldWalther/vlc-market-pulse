  notes:
    - "All shared/github-oidc applies are LOCAL by design. CI must never be able to modify its own roles or the boundary."
    - "Before 18.2: the owner must apply PR #44 to prod locally (prod state machine still has the old email subjects as of 2026-10-24)."
    - "18.2 is irreversible in the sense that credential values leave Terraform; the secrets themselves stay in AWS. Rotation from then on: aws secretsmanager put-secret-value."
    - "Idealista quota is shared between dev and prod (100 requests/month). Never run the prod state machine as a smoke test; never run more than one dev state-machine execution per task."
