name: Python Linting and Testing

on:
  pull_request:
    paths:
      - 'src/etl/**'
      - '.github/workflows/python-test.yml'
  push:
    branches:
      - main
    paths:
      - 'src/etl/**'
      - '.github/workflows/python-test.yml'
  workflow_dispatch:

jobs:
  lint:
    name: Lint Python Code
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff black mypy
          pip install -r src/etl/data_collection/requirements.txt
          pip install -r src/etl/requirements-dev.txt

      - name: Run Ruff
        run: ruff check src/etl/

      - name: Check Black formatting
        run: black --check src/etl/

      - name: Run MyPy
        run: mypy src/etl/ --exclude='src/etl/(tests|data_collection/tests|data_processing/tests|common/tests|pipeline_health/tests)/'

  test:
    name: Run Tests
    runs-on: ubuntu-latest

    env:
      AWS_DEFAULT_REGION: eu-central-1
      AWS_ACCESS_KEY_ID: test-key-id
      AWS_SECRET_ACCESS_KEY: test-secret-key

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r src/etl/data_collection/requirements.txt
          pip install -r src/etl/requirements-dev.txt

      - name: Run tests with coverage
        run: |
          cd src/etl
          pytest common/tests/ data_collection/tests/ data_processing/tests/ pipeline_health/tests/ --cov=common --cov=data_collection --cov=data_processing --cov=pipeline_health --cov-report=xml --cov-report=term --cov-fail-under=80

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@0fb7174895f61a3b6b78fc075e0cd60383518dac # v5.5.5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./src/etl/coverage.xml
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false
